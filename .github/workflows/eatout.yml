name: Update eat-out data

on:
  schedule:
    - cron: '17 19 * * *' # 台灣時間每天 03:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eatout
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 順便叫醒 Supabase：免費方案一週沒人用會自動暫停
      - name: Keep Supabase awake
        continue-on-error: true
        run: curl -fsS -o /dev/null "https://tkzduoxcmnlolksnvgqt.supabase.co/rest/v1/announcements?select=id&limit=1" -H "apikey: sb_publishable_Xwy2FxyhxyCcbhqPTos4HQ_yp3OU82c"
      - run: node scripts/update-eatout.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/eatout)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/eatout
            git commit -m "外食資料每日更新"
            git push
          else
            echo "沒有變動"
          fi
